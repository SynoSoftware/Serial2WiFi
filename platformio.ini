; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-lora32-v1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = ttgo-lora32-v1
framework = arduino
upload_speed = 1500000
monitor_speed = 19200
board_build.filesystem = littlefs

; Runs after the platform script so $ESP32_FS_IMAGE_NAME is defined.
extra_scripts = post:tools/build_stamp.py

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; TTGO LoRa32 V1 reports a 26 MHz crystal on the live chip; keep the core clock setup aligned.
    -DF_XTAL_MHZ=26

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    ricmoo/QRCode

; cppcheck analyzes each translation unit independently, so it cannot see
; calls to the firmware's public module APIs from other source files.
; The remaining suppressed style checks are emitted only by third-party
; dependency headers, which are not part of this firmware's source.
check_flags =
    --suppress=unusedFunction
    --suppress=useStlAlgorithm
    --suppress=noExplicitConstructor
    --suppress=missingOverride
check_skip_packages = yes
