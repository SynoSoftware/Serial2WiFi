<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serial2WiFi</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="shell">
        <header class="device-header">
            <div>
                <p class="eyebrow">Serial2WiFi</p>
                <h1 id="deviceName">Loading device…</h1>
            </div>
            <div class="state-pills" aria-label="Connection status">
                <span id="wifiState" class="pill">Wi-Fi —</span>
                <span id="tcpState" class="pill">TCP —</span>
            </div>
        </header>

        <p id="announcements" class="announcement" aria-live="polite"></p>

        <form id="configuration" class="panel" hidden>
            <h2>Wi-Fi</h2>
            <p class="muted">Choose the network this gateway should join.</p>

            <div id="scanState" class="scan-state" aria-live="polite">Scanning…</div>
            <div id="networkList" class="network-list" role="listbox" aria-label="Wi-Fi networks"></div>
            <button id="otherNetwork" class="secondary full" type="button">Other network</button>
            <button id="scanAgain" class="secondary full" type="button">Scan again</button>

            <div id="manualSecurityGroup" class="field" hidden>
                <label for="wifiSecurity">Network security</label>
                <select id="wifiSecurity" aria-describedby="wifiSecurityError">
                    <option value="secured">Password-protected</option>
                    <option value="open">Open</option>
                </select>
                <p id="wifiSecurityError" class="field-error" role="alert"></p>
            </div>

            <div class="field">
                <label for="ssid">Network name (SSID)</label>
                <input id="ssid" name="ssid" autocomplete="off" maxlength="32" aria-describedby="ssidError">
                <p id="ssidError" class="field-error" role="alert"></p>
            </div>

            <div id="passwordGroup" class="field">
                <label for="wifiPassword">Wi-Fi password</label>
                <div class="password-control">
                    <input id="wifiPassword" name="wifiPassword" type="password" autocomplete="current-password" maxlength="64" aria-describedby="wifiPasswordError">
                    <button id="showPassword" class="inline-button" type="button" aria-pressed="false">Show</button>
                </div>
                <p id="wifiPasswordError" class="field-error" role="alert"></p>
            </div>

            <section class="subsection">
                <h2>TCP server</h2>
                <div class="field">
                    <label for="tcpHost">Server host</label>
                    <input id="tcpHost" maxlength="253" autocomplete="off" aria-describedby="tcpHostError">
                    <p id="tcpHostError" class="field-error" role="alert"></p>
                </div>
                <div class="field">
                    <label for="tcpPort">Server port</label>
                    <input id="tcpPort" type="number" min="0" max="65535" inputmode="numeric" aria-describedby="tcpPortError">
                    <p id="tcpPortError" class="field-error" role="alert"></p>
                </div>
            </section>

            <section class="subsection">
                <h2>Serial</h2>
                <div class="field">
                    <label for="baud">Baud rate</label>
                    <select id="baud" aria-describedby="baudError">
                        <option>2400</option><option>4800</option><option>9600</option>
                        <option>19200</option><option>38400</option><option>57600</option>
                        <option>115200</option><option>230400</option><option>460800</option>
                        <option>921600</option><option>1000000</option>
                    </select>
                    <p id="baudError" class="field-error" role="alert"></p>
                </div>
                <div class="field">
                    <label for="framing">Framing</label>
                    <select id="framing" aria-describedby="framingError">
                        <option>8N1</option><option>8N2</option><option>8E1</option>
                        <option>8O1</option><option>7E1</option><option>7O1</option>
                    </select>
                    <p id="framingError" class="field-error" role="alert"></p>
                </div>
                <div class="field">
                    <label for="display">OLED display</label>
                    <select id="display" aria-describedby="displayError">
                        <option value="text">Live text</option>
                        <option value="hex">Live hex</option>
                        <option value="stats">Statistics</option>
                        <option value="off">Off</option>
                    </select>
                    <p id="displayError" class="field-error" role="alert"></p>
                </div>
            </section>

            <button id="save" class="primary full" type="submit">Save and connect</button>
        </form>

        <section id="statusPanel" class="panel">
            <h2>Status</h2>
            <dl class="status-grid">
                <div><dt>Station IP</dt><dd id="stationIp">—</dd></div>
                <div><dt>Baud</dt><dd id="statusBaud">—</dd></div>
                <div><dt>Framing</dt><dd id="statusFraming">—</dd></div>
                <div><dt>SER→NET received</dt><dd id="statusS2N">—</dd></div>
                <div><dt>NET→SER received</dt><dd id="statusN2S">—</dd></div>
                <div><dt>Drops</dt><dd id="statusDrops">—</dd></div>
            </dl>
        </section>
    </main>
    <script src="/app.js"></script>
</body>
</html>
