<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Serial2WiFi</title>
        <link rel="stylesheet" href="/style.css" />
        <script>
            // The palette is chosen by this attribute, so it has to be set
            // before the first paint or a stored choice flashes the other
            // theme. No stored choice means follow the system.
            (function () {
                var stored = null;
                try {
                    stored = localStorage.getItem("theme");
                } catch (error) {
                    stored = null;
                }
                var dark = stored === null
                    ? window.matchMedia("(prefers-color-scheme: dark)").matches
                    : stored === "dark";
                document.documentElement.dataset.theme = dark ? "dark" : "light";
            })();
        </script>
    </head>

        <main class="shell">
            <header class="brand-row">
                <div class="device-brand">
                    <div class="brand-lockup">
                        <h1 class="product-name">Serial2WiFi</h1>
                        <span class="brand-name">synapse.sr</span>
                    </div>
                    <span id="deviceName" class="device-name"></span>
                </div>
                <div class="brand-actions">
                    <button
                        id="themeToggle"
                        class="icon-button brand-action"
                        type="button"
                        data-i18n-label="theme.toggle"
                    >
                        <svg class="icon" aria-hidden="true">
                            <use id="themeIcon" href="#icon-moon"></use>
                        </svg>
                    </button>
                    <button
                        id="loginButton"
                        class="secondary-button icon-text brand-action"
                        type="button"
                        hidden
                    >
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-log-in"></use></svg
                        ><span data-i18n="auth.signIn.command"></span>
                    </button>
                    <button
                        id="logoutButton"
                        class="secondary-button icon-text brand-action"
                        type="button"
                        hidden
                    >
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-log-out"></use></svg
                        ><span data-i18n="auth.signOut.command"></span>
                    </button>
                </div>
            </header>

            <div id="navigation" class="navigation" hidden>
                <nav class="tabs" role="tablist" aria-label="Serial2WiFi">
                    <button
                        id="setupTab"
                        class="tab"
                        type="button"
                        role="tab"
                        aria-selected="true"
                        aria-controls="setupView"
                        data-view="setupView"
                    >
                        <svg class="icon tab-icon" aria-hidden="true">
                            <use href="#icon-settings-2"></use></svg
                        ><span data-i18n="nav.setup"></span>
                    </button>
                    <button
                        id="statusTab"
                        class="tab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="statusView"
                        data-view="statusView"
                        tabindex="-1"
                    >
                        <svg class="icon tab-icon" aria-hidden="true">
                            <use href="#icon-activity"></use></svg
                        ><span data-i18n="nav.status"></span>
                    </button>
                    <button
                        id="terminalTab"
                        class="tab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="terminalView"
                        data-view="terminalView"
                        tabindex="-1"
                    >
                        <svg class="icon tab-icon" aria-hidden="true">
                            <use href="#icon-square-terminal"></use></svg
                        ><span data-i18n="nav.terminal"></span>
                    </button>
                </nav>
            </div>

            <div id="globalNotice" class="message-bar" role="status" hidden>
                <svg class="icon" aria-hidden="true">
                    <use href="#icon-triangle-alert"></use>
                </svg>
                <span id="globalNoticeText" data-i18n="app.connectionLost"></span>
            </div>
            <p id="announcements" class="sr-only" aria-live="polite"></p>

            <section id="bootView" class="boot-view" aria-live="polite">
                <svg class="icon spin" aria-hidden="true">
                    <use href="#icon-loader-circle"></use>
                </svg>
                <span data-i18n="boot.connecting"></span>
            </section>

            <section
                id="setupView"
                class="view"
                role="tabpanel"
                aria-labelledby="setupTab"
                hidden
            >
                <div class="view-content">
                    <div id="setupLoading" class="loading-state" role="status">
                        <svg class="icon spin" aria-hidden="true">
                            <use href="#icon-loader-circle"></use>
                        </svg>
                        <span data-i18n="setup.loading"></span>
                    </div>

                    <div id="setupUnavailable" class="notice" hidden>
                        <svg class="icon notice-icon" aria-hidden="true">
                            <use href="#icon-info"></use>
                        </svg>
                        <div>
                            <h2 data-i18n="setup.unavailableTitle"></h2>
                            <button
                                id="retrySetup"
                                class="secondary-button icon-text"
                                type="button"
                            >
                                <svg class="icon" aria-hidden="true">
                                    <use href="#icon-refresh-cw"></use></svg
                                ><span data-i18n="common.retry"></span>
                            </button>
                        </div>
                    </div>

                    <form id="configuration" hidden novalidate>
                        <section
                            class="settings-section"
                            aria-labelledby="wifiTitle"
                        >
                            <h2 id="wifiTitle" class="section-title">
                                <svg
                                    class="icon section-icon"
                                    aria-hidden="true"
                                >
                                    <use href="#icon-wifi"></use></svg
                                ><span data-i18n="wifi.title"></span>
                            </h2>

                            <div id="wifiSummary">
                                <div id="wifiConfigured" hidden>
                                    <div class="setting-row">
                                        <span class="setting-label" data-i18n="wifi.network.label"></span>
                                        <div class="setting-value">
                                            <strong id="wifiCurrentName"
                                                >-</strong
                                            >
                                        </div>
                                        <button
                                            id="changeNetwork"
                                            class="secondary-button icon-text"
                                            type="button"
                                            data-i18n-label="wifi.network.changeLabel"
                                        >
                                            <svg
                                                class="icon"
                                                aria-hidden="true"
                                            >
                                                <use
                                                    href="#icon-wifi"
                                                ></use></svg
                                            ><span data-i18n="common.change"></span>
                                        </button>
                                    </div>
                                    <div
                                        id="passwordSummary"
                                        class="setting-row"
                                        hidden
                                    >
                                        <span class="setting-label" data-i18n="wifi.password.label"></span>
                                        <span id="passwordState" class="setting-value muted" data-i18n="wifi.password.saved"></span>
                                        <button
                                            id="changePassword"
                                            class="secondary-button icon-text"
                                            type="button"
                                            data-i18n-label="wifi.password.changeLabel"
                                        >
                                            <svg
                                                class="icon"
                                                aria-hidden="true"
                                            >
                                                <use
                                                    href="#icon-key-round"
                                                ></use></svg
                                            ><span data-i18n="common.change"></span>
                                        </button>
                                    </div>
                                </div>
                                <div
                                    id="wifiEmpty"
                                    class="empty-setting"
                                    hidden
                                >
                                    <span data-i18n="wifi.network.none"></span>
                                    <button
                                        id="chooseNetwork"
                                        class="secondary-button icon-text"
                                        type="button"
                                        data-i18n-label="wifi.network.scanLabel"
                                    >
                                        <svg
                                            class="icon"
                                            aria-hidden="true"
                                        >
                                            <use
                                                href="#icon-radar"
                                            ></use></svg
                                        ><span data-i18n="common.scan"></span>
                                    </button>
                                </div>
                                <!-- Typing a name must never depend on a
                                network being absent: a configured device is
                                exactly when a wrong network has to be
                                corrected, and the scan list may be empty. -->
                                <div class="network-transaction-actions">
                                    <button
                                        id="forgetNetwork"
                                        class="secondary-button icon-text"
                                        type="button"
                                        hidden
                                    >
                                        <svg
                                            class="icon"
                                            aria-hidden="true"
                                        >
                                            <use
                                                href="#icon-trash-2"
                                            ></use></svg
                                        ><span data-i18n="common.forget"></span>
                                    </button>
                                    <button
                                        id="enterNetwork"
                                        class="secondary-button icon-text"
                                        type="button"
                                        data-i18n-label="wifi.network.addLabel"
                                    >
                                        <svg
                                            class="icon"
                                            aria-hidden="true"
                                        >
                                            <use
                                                href="#icon-plus"
                                            ></use></svg
                                        ><span data-i18n="common.add"></span>
                                    </button>
                                </div>
                                <div
                                    id="wifiState"
                                    class="save-state wifi-state"
                                    aria-live="polite"
                                    hidden
                                >
                                    <svg class="icon" aria-hidden="true">
                                        <use
                                            id="wifiStateIcon"
                                            href="#icon-circle-x"
                                        ></use>
                                    </svg>
                                    <span id="wifiStateText"></span>
                                </div>
                            </div>

                            <div id="wifiEditor" class="editor-panel" hidden>
                                <div id="wifiTrial" class="wifi-editor" hidden>
                                    <div class="editor-heading">
                                        <div class="editor-title">
                                            <strong id="trialTitle" data-i18n="wifi.trial.title"></strong>
                                            <span id="trialDetail"></span>
                                        </div>
                                    </div>
                                    <div
                                        id="trialProgress"
                                        class="progress"
                                        aria-hidden="true"
                                        hidden
                                    >
                                        <span></span>
                                    </div>
                                    <div id="trialHandoff" class="notice" hidden>
                                        <svg
                                            class="icon notice-icon"
                                            aria-hidden="true"
                                        >
                                            <use href="#icon-circle-check"></use>
                                        </svg>
                                        <div>
                                            <p id="trialHandoffAddress"></p>
                                            <p id="trialHandoffNext"></p>
                                        </div>
                                    </div>
                                </div>

                                <p
                                    id="trialMessage"
                                    class="trial-message"
                                    role="alert"
                                    hidden
                                ></p>

                                <div id="wifiChooser" class="wifi-editor" hidden>
                                    <div class="editor-heading">
                                        <div class="editor-title">
                                            <strong data-i18n="wifi.chooser.title"></strong>
                                            <span
                                                id="scanState"
                                                class="scan-state"
                                                aria-live="polite"
                                            ></span>
                                        </div>
                                    </div>
                                    <div
                                        id="scanProgress"
                                        class="progress"
                                        aria-hidden="true"
                                        hidden
                                    >
                                        <span></span>
                                    </div>
                                    <div
                                        id="networkList"
                                        class="network-list"
                                        data-i18n-label="wifi.chooser.listLabel"
                                    ></div>
                                    <button
                                        id="otherNetwork"
                                        class="network-row network-other"
                                        type="button"
                                    >
                                        <span class="network-leading"
                                            ><svg class="icon" aria-hidden="true">
                                                <use href="#icon-eye-off"></use></svg
                                            ><span data-i18n="wifi.chooser.hidden"></span></span
                                        >
                                        <span class="network-meta" data-i18n="wifi.chooser.hiddenAction"></span>
                                    </button>
                                </div>

                                <div
                                    id="wifiCredentials"
                                    class="wifi-editor"
                                    hidden
                                >
                                    <div class="editor-heading">
                                        <div class="editor-title">
                                            <strong id="wifiCredentialsName" data-i18n="wifi.editor.networkHeading"></strong>
                                        </div>
                                    </div>
                                </div>

                                <div
                                    id="manualNetworkFields"
                                    class="wifi-editor"
                                    hidden
                                >
                                    <div class="network-grid">
                                        <div class="field">
                                            <label for="ssid" data-i18n="wifi.editor.ssidLabel"></label>
                                            <input
                                                id="ssid"
                                                autocomplete="off"
                                                maxlength="32"
                                                aria-describedby="ssidError"
                                            />
                                            <p
                                                id="ssidError"
                                                class="field-error"
                                                role="alert"
                                                hidden
                                            ></p>
                                        </div>
                                        <div class="field">
                                            <label for="wifiSecurity" data-i18n="wifi.editor.securityLabel"></label>
                                            <select
                                                id="wifiSecurity"
                                                aria-describedby="wifiSecurityError"

                    <label for="bootstrapPasswordConfirm" data-i18n="security.password.confirmLabel"></label>
                    <div class="password-control">
                        <input
                            id="bootstrapPasswordConfirm"
                            type="password"
                            autocomplete="new-password"
                        />
                        <button
                            class="password-toggle"
                            type="button"
                            data-password-toggle="bootstrapPasswordConfirm"
                            data-i18n-label="security.password.showConfirmLabel"
                            aria-pressed="false"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="#icon-eye"></use>
                            </svg>
                        </button>
                    </div>
                </div>
                <p
                    id="authBootstrapError"
                    class="field-error"
                    role="alert"
                    hidden
                ></p>
                <div class="dialog-actions">
                    <button
                        id="bootstrapButton"
                        class="primary icon-text"
                        type="submit"
                    >
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-shield-check"></use></svg
                        ><span data-i18n="common.create"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <dialog
            id="passwordDialog"
            class="app-dialog"
            aria-labelledby="passwordDialogTitle"
        >
            <div class="dialog-header">
                <div>
                    <h2 id="passwordDialogTitle" data-i18n="security.password.changeTitle"></h2>
                    <p data-i18n="security.password.changeNotice"></p>
                </div>
            </div>
            <form id="passwordChangeEditor" class="dialog-body">
                <div class="field">
                    <label for="currentAdminPassword" data-i18n="security.password.currentLabel"></label>
                    <div class="password-control">
                        <input
                            id="currentAdminPassword"
                            type="password"
                            autocomplete="current-password"
                        />
                        <button
                            class="password-toggle"
                            type="button"
                            data-password-toggle="currentAdminPassword"
                            data-i18n-label="security.password.showCurrentLabel"
                            aria-pressed="false"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="#icon-eye"></use>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label for="newAdminPassword" data-i18n="security.password.newLabel"></label>
                    <div class="password-control">
                        <input
                            id="newAdminPassword"
                            type="password"
                            autocomplete="new-password"
                        />
                        <button
                            class="password-toggle"
                            type="button"
                            data-password-toggle="newAdminPassword"
                            data-i18n-label="security.password.showNewLabel"
                            aria-pressed="false"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="#icon-eye"></use>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label for="confirmAdminPassword" data-i18n="security.password.confirmLabel"></label>
                    <div class="password-control">
                        <input
                            id="confirmAdminPassword"
                            type="password"
                            autocomplete="new-password"
                        />
                        <button
                            class="password-toggle"
                            type="button"
                            data-password-toggle="confirmAdminPassword"
                            data-i18n-label="security.password.showConfirmLabel"
                            aria-pressed="false"
                        >
                            <svg class="icon" aria-hidden="true">
                                <use href="#icon-eye"></use>
                            </svg>
                        </button>
                    </div>
                </div>
                <p
                    id="passwordChangeError"
                    class="field-error"
                    role="alert"
                    hidden
                ></p>
                <p
                    id="passwordChangeFeedback"
                    class="field-help success-text"
                    role="status"
                    hidden
                ></p>
                <div class="dialog-actions">
                    <button
                        id="cancelPasswordUpdate"
                        class="secondary-button icon-text"
                        type="button"
                    >
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-x"></use></svg
                        ><span data-i18n="common.cancel"></span>
                    </button>
                    <button
                        id="updatePassword"
                        class="primary icon-text"
                        type="submit"
                        data-i18n-label="security.password.changeLabel"
                    >
                        <svg class="icon" aria-hidden="true">
                            <use href="#icon-key-round"></use></svg
                        ><span data-i18n="common.change"></span>
                    </button>
                </div>
            </form>
        </dialog>

        <dialog
            id="forgetDialog"
            class="app-dialog confirmation-dialog"
            aria-labelledby="forgetDialogTitle"
        >
            <div class="dialog-header">
                <div>
                    <h2 id="forgetDialogTitle" data-i18n="wifi.forget.title"></h2>
                    <p id="forgetDialogDetail"></p>
                </div>
            </div>
            <div class="dialog-actions">
                <button
                    id="keepNetwork"
                    class="secondary-button icon-text"
                    type="button"
                >
                    <svg class="icon" aria-hidden="true">
                        <use href="#icon-x"></use></svg
                    ><span data-i18n="common.cancel"></span>
                </button>
                <button
                    id="confirmForget"
                    class="danger-button icon-text"
                    type="button"
                >
                    <svg class="icon" aria-hidden="true">
                        <use href="#icon-trash-2"></use></svg
                    ><span data-i18n="common.forget"></span>
                </button>
            </div>
        </dialog>

        <dialog
            id="signoutDialog"
            class="app-dialog confirmation-dialog"
            aria-labelledby="signoutDialogTitle"
        >
            <div class="dialog-header">
                <div>
                    <h2 id="signoutDialogTitle" data-i18n="auth.signOut.title"></h2>
                </div>
            </div>
            <div class="dialog-actions">
                <button
                    id="keepSession"
                    class="secondary-button icon-text"
                    type="button"
                >
                    <svg class="icon" aria-hidden="true">
                        <use href="#icon-x"></use></svg
                    ><span data-i18n="common.cancel"></span>
                </button>
                <button
                    id="confirmSignout"
                    class="danger-button icon-text"
                    type="button"
                >
                    <svg class="icon" aria-hidden="true">
                        <use href="#icon-log-out"></use></svg
                    ><span data-i18n="auth.signOut.command"></span>
                </button>
            </div>
        </dialog>

        <script src="/strings.js"></script>
        <script src="/app.js"></script>
    </body>
</html>
